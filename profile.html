<!DOCTYPE html>
<html lang="en" data-theme="cupcake">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TRANZO | Profile</title>

    <link rel="icon" href="assets/logo.png">

    <!-- DaisyUI -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            font-family:'Outfit',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#eef5ff,#dbeafe,#eef2ff);
        }

        .tranzo-card{
            border-radius:30px;
            transition:.35s;
        }

        .tranzo-card:hover{
            transform:translateY(-5px);
        }

        .banner{
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            color:white;
            border-radius:30px;
            padding:35px;
        }

        .profile-image{

            width:150px;
            height:150px;

            border-radius:50%;

            object-fit:cover;

            border:5px solid white;

            box-shadow:0 10px 25px rgba(0,0,0,.15);

        }

    </style>

</head>

<body>

<div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Header -->

    <div class="flex justify-between items-center mb-8">

        <a href="dashboard.html"
           class="btn btn-circle btn-outline">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <img src="assets/logo full.png"
             class="w-44">

    </div>

    <!-- Banner -->

    <div class="banner shadow-xl mb-8">

        <div class="flex flex-col md:flex-row justify-between items-center gap-6">

            <div>

                <h1 class="text-4xl font-bold">

                    <i class="fa-solid fa-user"></i>

                    My Profile

                </h1>

                <p class="mt-3 text-blue-100">

                    Manage your personal information and account details.

                </p>

            </div>

            <div class="text-7xl opacity-30">

                <i class="fa-solid fa-id-card"></i>

            </div>

        </div>

    </div>
        <!-- ================= Main Content ================= -->

    <div class="grid lg:grid-cols-3 gap-8">

        <!-- ================= Left Card ================= -->

        <div class="card bg-base-100 shadow-xl tranzo-card">

            <div class="card-body items-center text-center">

                <!-- Profile Image -->

                <img
                    id="profilePreview"
                    src="assets/profile-placeholder.png"
                    alt="Profile"
                    class="profile-image">

                <!-- Upload Button -->

                <input
                    type="file"
                    id="profileImage"
                    accept="image/*"
                    class="file-input file-input-bordered file-input-primary w-full mt-6">

                <h2 class="text-2xl font-bold mt-6">

                    Profile Picture

                </h2>

                <p class="text-gray-500">

                    Select your own profile photo.

                </p>

                <div class="divider"></div>

                <!-- Verification -->

                <div class="badge badge-success badge-lg">

                    <i class="fa-solid fa-circle-check mr-2"></i>

                    Verified Account

                </div>

            </div>

        </div>



        <!-- ================= Right Card ================= -->

        <div class="lg:col-span-2">

            <div class="card bg-base-100 shadow-xl tranzo-card">

                <div class="card-body">

                    <h2 class="text-2xl font-bold mb-6">

                        Personal Information

                    </h2>

                    <div class="grid md:grid-cols-2 gap-5">

                        <!-- Full Name -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Full Name

                                </span>

                            </label>

                            <input
                                id="fullName"
                                type="text"
                                placeholder="Enter your full name"
                                class="input input-bordered rounded-full w-full">

                        </div>



                        <!-- Mobile -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Mobile Number

                                </span>

                            </label>

                            <input
                                id="mobile"
                                type="tel"
                                maxlength="11"
                                placeholder="01XXXXXXXXX"
                                class="input input-bordered rounded-full w-full">

                        </div>



                        <!-- Email -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Email Address

                                </span>

                            </label>

                            <input
                                id="email"
                                type="email"
                                placeholder="example@email.com"
                                class="input input-bordered rounded-full w-full">

                        </div>



                        <!-- Date of Birth -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Date of Birth

                                </span>

                            </label>

                            <input
                                id="dob"
                                type="date"
                                class="input input-bordered rounded-full w-full">

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
                        <div class="grid md:grid-cols-2 gap-5 mt-5">

                        <!-- Gender -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Gender

                                </span>

                            </label>

                            <select
                                id="gender"
                                class="select select-bordered rounded-full w-full">

                                <option selected disabled>

                                    Select Gender

                                </option>

                                <option>

                                    Male

                                </option>

                                <option>

                                    Female

                                </option>

                                <option>

                                    Other

                                </option>

                            </select>

                        </div>



                        <!-- NID -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    NID Number

                                </span>

                            </label>

                            <input
                                id="nid"
                                type="text"
                                placeholder="Enter NID Number"
                                class="input input-bordered rounded-full w-full">

                        </div>



                        <!-- Occupation -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Occupation

                                </span>

                            </label>

                            <input
                                id="occupation"
                                type="text"
                                placeholder="Enter Occupation"
                                class="input input-bordered rounded-full w-full">

                        </div>



                        <!-- Blood Group -->

                        <div>

                            <label class="label">

                                <span class="label-text">

                                    Blood Group

                                </span>

                            </label>

                            <select
                                id="bloodGroup"
                                class="select select-bordered rounded-full w-full">

                                <option selected disabled>

                                    Select Blood Group

                                </option>

                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>

                            </select>

                        </div>

                    </div>



                    <!-- Address -->

                    <div class="mt-5">

                        <label class="label">

                            <span class="label-text">

                                Address

                            </span>

                        </label>

                        <textarea
                            id="address"
                            class="textarea textarea-bordered rounded-3xl h-28 resize-none w-full"
                            placeholder="Enter your address"></textarea>

                    </div>



                    <!-- Buttons -->

                    <div class="mt-8 flex flex-col md:flex-row gap-4">

                        <button
                            type="button"
                            id="saveProfile"
                            class="btn flex-1 rounded-full text-white border-0 bg-gradient-to-r from-blue-600 to-indigo-700 hover:scale-105 duration-300">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Changes

                        </button>



                        <button
                            type="reset"
                            class="btn btn-outline rounded-full flex-1">

                            <i class="fa-solid fa-rotate-left"></i>

                            Reset

                        </button>



                        <button
                            type="button"
                            onclick="passwordModal.showModal()"
                            class="btn btn-warning rounded-full flex-1">

                            <i class="fa-solid fa-key"></i>

                            Change Password

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- ================= Change Password Modal ================= -->

<dialog id="passwordModal" class="modal">

    <div class="modal-box rounded-3xl">

        <h2 class="text-2xl font-bold mb-6">

            Change Password

        </h2>

        <div class="space-y-4">

            <input
                type="password"
                placeholder="Current Password"
                class="input input-bordered rounded-full w-full">

            <input
                type="password"
                placeholder="New Password"
                class="input input-bordered rounded-full w-full">

            <input
                type="password"
                placeholder="Confirm Password"
                class="input input-bordered rounded-full w-full">

        </div>

        <div class="modal-action">

            <form method="dialog">

                <button class="btn btn-outline rounded-full">

                    Cancel

                </button>

            </form>

            <button
                onclick="savePassword()"
                class="btn btn-warning rounded-full">

                Update Password

            </button>

        </div>

    </div>

</dialog>



<!-- ================= Success Modal ================= -->

<dialog id="successModal" class="modal">

    <div class="modal-box rounded-3xl text-center">

        <div class="w-24 h-24 mx-auto rounded-full bg-green-100 flex items-center justify-center">

            <i class="fa-solid fa-circle-check text-success text-5xl"></i>

        </div>

        <h2 class="text-3xl font-bold mt-5">

            Profile Updated

        </h2>

        <p class="text-gray-500 mt-3">

            Your information has been updated successfully.

        </p>

        <div class="modal-action justify-center">

            <form method="dialog">

                <button class="btn btn-success rounded-full px-10">

                    OK

                </button>

            </form>

        </div>

    </div>

</dialog>



<script>

// Profile Image Preview

document.getElementById("profileImage").addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    document.getElementById("profilePreview").src =
        URL.createObjectURL(file);

});

// Save Profile (Frontend Demo)

document.getElementById("saveProfile").addEventListener("click", function () {

    successModal.showModal();

});

// Change Password (Frontend Demo)


function savePassword(){

    passwordModal.close();

    successModal.showModal();

}

</script>

</body>

</html>
