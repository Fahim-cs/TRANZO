<!-- ================= Topbar ================= -->

<header class="sticky top-0 z-40 bg-white border-b border-slate-200">

    <div class="h-20 px-6 flex items-center justify-between">

        <!-- Left Section -->

        <div class="flex items-center gap-4">

            <!-- Mobile Menu Button -->

            <label for="admin-drawer"
                   class="btn btn-ghost btn-circle lg:hidden">

                <i class="fa-solid fa-bars text-lg"></i>

            </label>

            <!-- Page Title -->

            <div>

                <h1 id="page-title"
                    class="text-2xl font-bold text-slate-800">

                    Dashboard

                </h1>

                <p class="text-sm text-slate-500">

                    Welcome back, Administrator

                </p>

            </div>

        </div>

        <!-- Right Section -->

        <div class="flex items-center gap-4">

            <!-- Search -->

            <label class="input input-bordered hidden md:flex items-center gap-2 rounded-full w-72">

                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>

                <input type="text"
                       class="grow"
                       placeholder="Search users, transactions..." />

            </label>

            <!-- Notification -->

            <button class="btn btn-ghost btn-circle relative">

                <i class="fa-regular fa-bell text-xl"></i>

                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>

            </button>
                        <!-- Current Date & Time -->

            <div class="hidden lg:flex flex-col text-right">

                <span id="currentDate"
                      class="text-sm font-semibold text-slate-700">

                    06 Aug 2026

                </span>

                <span id="currentTime"
                      class="text-xs text-slate-500">

                    10:30 AM

                </span>

            </div>

            <!-- Admin Profile -->

            <div class="dropdown dropdown-end">

                <label tabindex="0"
                       class="btn btn-ghost rounded-xl px-2">

                    <div class="avatar">

                        <div class="w-11 rounded-full">

                            <img src="assets/admin.png"
                                 alt="Administrator">

                        </div>

                    </div>

                    <div class="hidden md:block text-left ml-3">

                        <h3 class="font-semibold text-sm">

                            Administrator

                        </h3>

                        <p class="text-xs text-slate-500">

                            Admin

                        </p>

                    </div>

                    <i class="fa-solid fa-chevron-down text-xs ml-2"></i>

                </label>

                <!-- Dropdown Menu -->

                <ul tabindex="0"
                    class="dropdown-content z-[999] menu p-2 mt-3 shadow-lg bg-base-100 rounded-2xl w-64">

                    <li>

                        <a href="admin-profile.html">

                            <i class="fa-solid fa-user"></i>

                            My Profile

                        </a>

                    </li>

                    <li>

                        <a href="admin-settings.html">

                            <i class="fa-solid fa-gear"></i>

                            Settings

                        </a>

                    </li>

                    <li>

                        <a href="admin-help.html">

                            <i class="fa-solid fa-circle-question"></i>

                            Help Center

                        </a>

                    </li>

                    <li>

                        <hr>

                    </li>

                    <li>

                        <a href="admin-login.html"
                           class="text-error">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Logout

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </div>

</header>
