<!DOCTYPE html>
<html lang="en" data-theme="cupcake">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRANZO | Notifications</title>

    <link rel="icon" href="assets/logo.png">

    <!-- DaisyUI -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{

            font-family:'Outfit',sans-serif;

        }

        body{

            background:linear-gradient(135deg,#eef5ff,#dbeafe,#eef2ff);

        }

        .tranzo-card{

            border-radius:30px;

            transition:.3s;

        }

        .tranzo-card:hover{

            transform:translateY(-5px);

        }

        .header{

            background:linear-gradient(135deg,#2563eb,#4f46e5);

            color:white;

            border-radius:30px;

            padding:35px;

        }

    </style>

</head>

<body>

<div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Header -->

    <div class="flex justify-between items-center mb-8">

        <a href="dashboard.html"
           class="btn btn-circle btn-outline">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <img src="assets/logo full.png"
             class="w-44">

    </div>

    <!-- Banner -->

    <div class="header shadow-xl mb-8">

        <div class="flex justify-between items-center">

            <div>

                <h1 class="text-4xl font-bold">

                    <i class="fa-solid fa-bell"></i>

                    Notifications

                </h1>

                <p class="text-blue-100 mt-3">

                    View all your account notifications in one place.

                </p>

            </div>

            <i class="fa-solid fa-bell text-7xl opacity-20"></i>

        </div>

    </div>
        <!-- ================= Summary Cards ================= -->

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

        <!-- Total -->

        <div class="card bg-base-100 shadow-xl tranzo-card">

            <div class="card-body text-center">

                <div class="w-16 h-16 rounded-full bg-blue-100 mx-auto flex items-center justify-center">

                    <i class="fa-solid fa-bell text-blue-600 text-2xl"></i>

                </div>

                <h3 class="text-gray-500 mt-4">

                    Total

                </h3>

                <h2
                    id="totalNotification"
                    class="text-3xl font-bold">

                    0

                </h2>

            </div>

        </div>



        <!-- Unread -->

        <div class="card bg-base-100 shadow-xl tranzo-card">

            <div class="card-body text-center">

                <div class="w-16 h-16 rounded-full bg-red-100 mx-auto flex items-center justify-center">

                    <i class="fa-solid fa-envelope text-red-600 text-2xl"></i>

                </div>

                <h3 class="text-gray-500 mt-4">

                    Unread

                </h3>

                <h2
                    id="unreadNotification"
                    class="text-3xl font-bold text-red-600">

                    0

                </h2>

            </div>

        </div>



        <!-- Read -->

        <div class="card bg-base-100 shadow-xl tranzo-card">

            <div class="card-body text-center">

                <div class="w-16 h-16 rounded-full bg-green-100 mx-auto flex items-center justify-center">

                    <i class="fa-solid fa-circle-check text-green-600 text-2xl"></i>

                </div>

                <h3 class="text-gray-500 mt-4">

                    Read

                </h3>

                <h2
                    id="readNotification"
                    class="text-3xl font-bold text-green-600">

                    0

                </h2>

            </div>

        </div>



        <!-- Today -->

        <div class="card bg-base-100 shadow-xl tranzo-card">

            <div class="card-body text-center">

                <div class="w-16 h-16 rounded-full bg-purple-100 mx-auto flex items-center justify-center">

                    <i class="fa-solid fa-calendar-day text-purple-600 text-2xl"></i>

                </div>

                <h3 class="text-gray-500 mt-4">

                    Today

                </h3>

                <h2
                    id="todayNotification"
                    class="text-3xl font-bold text-purple-600">

                    0

                </h2>

            </div>

        </div>

    </div>



    <!-- ================= Notification List ================= -->

    <div class="card bg-base-100 shadow-xl rounded-3xl">

        <div class="card-body">

            <div class="flex justify-between items-center mb-6">

                <h2 class="text-2xl font-bold">

                    Recent Notifications

                </h2>

                <button
                    class="btn btn-outline btn-primary rounded-full">

                    <i class="fa-solid fa-check-double"></i>

                    Mark All as Read

                </button>

            </div>



            <div
                id="notificationContainer"
                class="space-y-4">

                <!-- Notifications will appear here -->



                <div class="text-center py-16 text-gray-400">

                    <i class="fa-regular fa-bell-slash text-6xl mb-4"></i>

                    <h3 class="text-xl font-semibold">

                        No Notifications Yet

                    </h3>

                    <p class="mt-2">

                        New notifications will appear here.

                    </p>

                </div>

            </div>

        </div>

    </div>
        <!-- ================= Notification Template ================= -->

    <!--
        এই card টি শুধু template.
        Demo দেখানোর জন্য copy-paste করে নিজের data বসাতে পারবে।
        Backend team পরে API দিয়ে এই structure generate করবে।
    -->

    <template id="notificationTemplate">

        <div class="flex items-start gap-4 p-5 rounded-3xl border border-base-300 hover:shadow-lg duration-300">

            <!-- Icon -->

            <div class="w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center">

                <i class="notificationIcon fa-solid fa-bell text-blue-600 text-xl"></i>

            </div>



            <!-- Content -->

            <div class="flex-1">

                <div class="flex justify-between items-start">

                    <div>

                        <h3 class="notificationTitle font-bold text-lg">

                            Notification Title

                        </h3>

                        <p class="notificationMessage text-gray-500 mt-1">

                            Notification message goes here...

                        </p>
                    </div>

                    <span class="notificationStatus badge badge-primary">

                        New

                    </span>

                </div>

                <div class="mt-3 text-sm text-gray-400">

                    <i class="fa-regular fa-clock mr-1"></i>

                    <span class="notificationTime">

                        Date & Time

                    </span>

                </div>

            </div>

        </div>

    </template>



    <!-- এখানেই Notification Card গুলো Add হবে -->

    <div
        id="notificationList"
        class="space-y-4 mt-6">

    </div>
    <script>

// ===========================================
// Notification System (Frontend Ready)
// Backend Team will replace this with API
// ===========================================

let notifications = [];

// Render Notifications

function renderNotifications() {

    const container = document.getElementById("notificationContainer");

    const list = document.getElementById("notificationList");

    if (!container || !list) return;

    if (notifications.length === 0) {

        container.style.display = "block";
        list.innerHTML = "";

        document.getElementById("totalNotification").innerText = 0;
        document.getElementById("unreadNotification").innerText = 0;
        document.getElementById("readNotification").innerText = 0;
        document.getElementById("todayNotification").innerText = 0;

        return;
    }

    container.style.display = "none";
    list.innerHTML = "";

    notifications.forEach(item => {

        const template = document.getElementById("notificationTemplate");

        const card = template.content.cloneNode(true);

        card.querySelector(".notificationTitle").innerText = item.title;
        card.querySelector(".notificationMessage").innerText = item.message;
        card.querySelector(".notificationTime").innerText = item.time;
        card.querySelector(".notificationStatus").innerText = item.status;

        list.appendChild(card);

    });

    document.getElementById("totalNotification").innerText = notifications.length;

    document.getElementById("unreadNotification").innerText =
        notifications.filter(n => n.status === "New").length;

    document.getElementById("readNotification").innerText =
        notifications.filter(n => n.status === "Read").length;

    document.getElementById("todayNotification").innerText =
        notifications.length;

}

// Mark All as Read

document.querySelector(".btn-primary").addEventListener("click", () => {

    notifications.forEach(item => {

        item.status = "Read";

    });

    renderNotifications();

});



// ===========================================
// Backend Integration Placeholder
// ===========================================

/*

Backend Team Example:

fetch("/api/notifications")

.then(res=>res.json())

.then(data=>{

    notifications=data;

    renderNotifications();

});

*/



// ===========================================
// Initial Render
// ===========================================

renderNotifications();

</script>

</body>

</html>
