<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
    

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANZO | Login</title>

    <link rel="icon" href="assets/logo.png" type="image/png">

    <!-- DaisyUI & Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef5ff, #dbeafe, #eef2ff);
        }

        .login-card {
            transition: .3s;
        }

        .login-card:hover {
            transform: translateY(-4px);
        }
    </style>
    

</head>

<body class="min-h-screen flex justify-center items-center px-4 py-6">

    <div class="w-full max-w-sm space-y-6">

        <!-- Logo -->
        <div class="text-center">
            <img src="assets/logo full.png" class="w-52 mx-auto" alt="Tranzo Logo">
        </div>

        <!-- Login Card -->
        <div class="card bg-base-100 shadow-2xl border border-base-300 rounded-3xl login-card">

            <div class="card-body p-7">

                <h2 class="text-3xl font-bold text-center">
                    Welcome Back
                    <i class="fa-solid fa-shield-heart text-pink-400"></i>
                </h2>

                <p class="text-center text-gray-500 mb-5">
                    Login to your Tranzo account
                </p>

              <form id="loginForm" class="space-y-5">

                    <!-- Mobile -->
                    <div>

                        <label class="label">
                            <span class="label-text font-medium">
                                Mobile Number
                            </span>
                        </label>

                        <label
                            class="input input-bordered flex items-center gap-3 rounded-full focus-within:ring-2 focus-within:ring-primary">

                            <i class="fa-solid fa-phone text-gray-400"></i>

                            <input id="phone"
                             type="tel"
                                placeholder="017XXXXXXXX"
                                maxlength="11"
                                class="grow"
                                required>

                        </label>

                    </div>

                    <!-- Password -->

                    <div>

                        <label class="label">
                            <span class="label-text font-medium">
                                Password
                            </span>
                        </label>

                        <label
                            class="input input-bordered flex items-center gap-3 rounded-full focus-within:ring-2 focus-within:ring-primary">

                            <i class="fa-solid fa-lock text-gray-400"></i>

                            <input id="password"
                                type="password"
                                placeholder="••••••••"
                                class="grow"
                                required>

                            <button
                                type="button"
                                onclick="togglePassword()">

                                <i id="eye"
                                    class="fa-solid fa-eye text-gray-400 hover:text-primary">
                                </i>

                            </button>

                        </label>

                    </div>

                    <!-- Forgot Password -->

                    <div class="text-right">

                        <a href="#"
                            class="text-primary text-sm hover:underline">

                            Forgot Password?

                        </a>

                    </div>

                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="btn w-full rounded-full text-white border-0 bg-gradient-to-r from-blue-600 to-indigo-700 hover:scale-105 duration-300">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        Login

                    </button>

                    <!-- Divider -->

                    <div class="divider">
                        OR
                    </div>

                    <!-- Register -->

                    <a href="register.html"
                        class="btn btn-outline btn-primary w-full rounded-full">

                        <i class="fa-solid fa-user-plus"></i>

                        Create New Account

                    </a>

                </form>

            </div>

        </div>

        <!-- Footer -->

        <p class="text-center text-xs text-gray-500">

            © 2026 TRANZO • Smart Mobile Financial Transaction System

        </p>

    </div>

    <script>
document.getElementById("loginForm").addEventListener("submit", function (e) {

    e.preventDefault();

    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;

    // Get registered users
    const users = JSON.parse(localStorage.getItem("users")) || [];

    // Find matching user
    const user = users.find(function (account) {
        return account.phone === phone &&
               account.password === password;
    });

    // Invalid login
    if (!user) {
        alert("Invalid mobile number or password.");
        return;
    }

    // Check account status
    if (user.status !== "Active") {
        alert("Your account is not active.");
        return;
    }

    // Save logged-in user
    localStorage.setItem("loggedInUser", JSON.stringify(user));

    // Go to dashboard
    window.location.href = "dashboard.html";

});
</script>

</body>

</html>
