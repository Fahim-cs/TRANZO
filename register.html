<!DOCTYPE html>
<html lang="en" data-theme="cupcake">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANZO | Register</title>

    <link rel="icon" href="assets/logo.png" type="image/png">

    <!-- Tailwind & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            font-family: "Outfit",sans-serif;
        }

        body{
            background: linear-gradient(135deg,#eef5ff,#dbeafe,#eef2ff);
        }

        .register-card{
            transition:.3s;
        }

        .register-card:hover{
            transform:translateY(-4px);
        }

    </style>

</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md space-y-6">

    <!-- Logo -->

    <div class="text-center">

        <img src="assets/logo full.png"
             class="w-56 mx-auto">

    </div>

    <!-- Register Card -->

    <div class="card bg-base-100 shadow-2xl border border-base-300 rounded-3xl register-card">

        <div class="card-body p-7">

            <h2 class="text-3xl font-bold text-center">

                Create Account 🚀

            </h2>

            <p class="text-center text-gray-500 mb-5">

                Join Tranzo and manage your finances smarter.

            </p>

            <form id="registerForm" class="space-y-4">

                <!-- Full Name -->

                <div>

                    <label class="label">

                        <span class="label-text font-medium">

                            Full Name

                        </span>

                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-full">

                        <i class="fa-solid fa-user text-gray-400"></i>

                        <input
                            id="name"
                            type="text"
                            placeholder="Enter your full name"
                            class="grow"
                            required>

                    </label>

                </div>

                <!-- Phone -->

                <div>

                    <label class="label">

                        <span class="label-text font-medium">

                            Mobile Number

                        </span>

                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-full">

                        <i class="fa-solid fa-phone text-gray-400"></i>

                        <input
                            id="phone"
                            type="tel"
                            maxlength="11"
                            placeholder="017XXXXXXXX"
                            class="grow"
                            required>

                    </label>

                </div>

                <!-- Email -->

                <div>

                    <label class="label">

                        <span class="label-text font-medium">

                            Email Address

                        </span>

                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-full">

                        <i class="fa-solid fa-envelope text-gray-400"></i>

                        <input
                            id="email"
                            type="email"
                            placeholder="example@gmail.com"
                            class="grow"
                            required>

                    </label>

                </div>

                <!-- Password -->

                <div>

                    <label class="label">

                        <span class="label-text font-medium">

                            Password

                        </span>

                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-full">

                        <i class="fa-solid fa-lock text-gray-400"></i>

                        <input
                            id="password"
                            type="password"
                            placeholder="Minimum 8 characters"
                            class="grow"
                            required>

                        <button type="button"
                                onclick="togglePassword('password','eye1')">

                            <i id="eye1"
                               class="fa-solid fa-eye text-gray-400"></i>

                        </button>

                    </label>

                </div>

                <!-- Confirm Password -->

                <div>

                    <label class="label">

                        <span class="label-text font-medium">

                            Confirm Password

                        </span>

                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-full">

                        <i class="fa-solid fa-lock text-gray-400"></i>

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Re-enter password"
                            class="grow"
                            required>

                        <button type="button"
                                onclick="togglePassword('confirmPassword','eye2')">

                            <i id="eye2"
                               class="fa-solid fa-eye text-gray-400"></i>

                        </button>

                    </label>

                </div>

                <!-- Terms -->

                <label class="label cursor-pointer justify-start gap-3">

                    <input
                        id="terms"
                        type="checkbox"
                        class="checkbox checkbox-primary">

                    <span class="label-text">

                        I agree to the
                        <a href="terms.html" class="text-primary font-semibold">
                            Terms & Conditions
                        </a>

                    </span>

                </label>

                <!-- Button -->

                <button
                    type="submit"
                    class="btn w-full rounded-full border-0 text-white bg-gradient-to-r from-blue-600 to-indigo-700 hover:scale-105 duration-300">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>

                <!-- Login -->

                <div class="text-center mt-4">

                    <span class="text-gray-500">

                        Already have an account?

                    </span>

                    <a href="login.html"
                       class="text-primary font-semibold hover:underline">

                        Login

                    </a>

                </div>

            </form>

        </div>

    </div>

    <p class="text-center text-xs text-gray-500">

        © 2026 TRANZO • Smart Mobile Financial Transaction System

    </p>

</div>
<script>

    // Show / Hide Password

    function togglePassword(inputId, eyeId) {

        const input = document.getElementById(inputId);
        const eye = document.getElementById(eyeId);

        if (input.type === "password") {

            input.type = "text";
            eye.classList.remove("fa-eye");
            eye.classList.add("fa-eye-slash");

        } else {

            input.type = "password";
            eye.classList.remove("fa-eye-slash");
            eye.classList.add("fa-eye");

        }

    }


    // Register Form

    document.getElementById("registerForm").addEventListener("submit", function (e) {

        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const terms = document.getElementById("terms").checked;


        // Validation

        if (name === "") {

            alert("Please enter your full name.");
            return;

        }

        if (!/^01\d{9}$/.test(phone)) {

            alert("Please enter a valid Bangladeshi mobile number.");
            return;

        }

        if (!/\S+@\S+\.\S+/.test(email)) {

            alert("Please enter a valid email address.");
            return;

        }

        if (password.length < 8) {

            alert("Password must be at least 8 characters.");
            return;

        }

        if (password !== confirmPassword) {

            alert("Passwords do not match.");
            return;

        }

        if (!terms) {

            alert("Please accept the Terms & Conditions.");
            return;

        }


        // Local Storage

        let users = JSON.parse(localStorage.getItem("users")) || [];


        // Duplicate Check

        const exists = users.find(user =>
            user.phone === phone || user.email === email
        );

        if (exists) {

            alert("Phone number or Email already registered.");
            return;

        }


        // Create User

        const newUser = {

            id: Date.now(),

            name: name,

            phone: phone,

            email: email,

            password: password,

            balance: 0,

            status: "Active",

            transactions: []

        };


        users.push(newUser);

        localStorage.setItem("users", JSON.stringify(users));


        alert("Account created successfully!");

        window.location.href = "login.html";

    });

</script>

</body>
</html>
